server:
  port: 8080

spring:
  application:
    name: campus
  # Java 21 虚拟线程：高并发下无需线程池调优
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/zhiyu_campus?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ssXXX
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

springdoc:
  swagger-ui:
    path: /doc.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    secret: emhpeXUtY2FtcHVzLWRldi1zZWNyZXQta2V5LTMyYnl0ZXMhIQ==
    access-minutes: 120
    refresh-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.zhiyu.campus: DEBUG
